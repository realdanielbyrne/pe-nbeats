# ============================================================
# M4 Complete Basis — the central positive prediction, never run
#
# Every M4 configuration in the paper sets basis_dim = forecast_length. That
# makes the FORECAST basis square and complete, but leaves the BACKCAST basis
# at only 20% coverage in every period, because L = 5H throughout:
#
#   period     H    L   fcast d/m   bcast d/m (default)   bcast rows short
#   Yearly     6    30     1.00           0.20                   24
#   Quarterly  8    40     1.00           0.20                   32
#   Weekly    13    65     1.00           0.20                   52
#   Daily     14    70     1.00           0.20                   56
#   Monthly   18    90     1.00           0.20                   72
#   Hourly    48   240     1.00           0.20                  192
#
# The completeness account says rank governs accuracy while d/m < 1 and goes
# inert once the basis is complete. On the forecast path that is already
# satisfied, which is why basis IDENTITY is a null there (36 paired
# comparisons, min p = 0.084). The backcast path has never been completed on
# M4, so the account's central POSITIVE prediction is untested.
#
# This study completes it. Each arm sets basis_dim = backcast_length for its
# period and pins forecast_basis_dim = forecast_length, so both paths are
# complete and every difference from the default arm is a backcast effect.
#
# PREDICTION: completing the backcast helps most where the absolute deficit is
# largest (Hourly 192, Monthly 72, Daily 56) and least where it is smallest
# (Yearly 24, Quarterly 32). Under the sliding sweep, merely DOUBLING the width
# already helps significantly on Hourly (-0.070, p=0.001), Daily (-0.126,
# p<0.001) and Monthly (-0.086, p=0.032) while hurting on Quarterly (+0.024,
# p=0.036) and Weekly (+0.060, p=0.023) — so a clean split is expected rather
# than a uniform gain.
# FALSIFIED IF: completing the backcast is flat or harmful everywhere, which
# would mean the backcast path does not carry the effect and the frozen basis
# is doing its work entirely through the forecast head.
#
# Prior art in this repo: wavelet_study_2 ran the Yearly rung (bd=30, eq_bcast)
# at n=3 and found it mid pack, spread 0.108 sMAPE. Underpowered; this is n=10.
#
# Cost note: widening the basis is nearly free in N-BEATS because the basis is
# a thin head on a wide trunk (bd 4->30 on Yearly costs +1.41% parameters).
# The runner records n_params, so the claim is checkable per arm.
#
# Wavelet family fixed at db3: family has no detectable effect (partial eta^2
# 0.0001-0.0036 at n=1161-2133, Fisher p=0.125 over 8 datasets).
#
# Usage:
#   python experiments/run_from_yaml.py experiments/configs/m4_complete_basis.yaml --dry-run
#   python experiments/run_from_yaml.py experiments/configs/m4_complete_basis.yaml
# ============================================================

experiment_name: m4_complete_basis
category: basis_completeness
description: >
  Completes the backcast basis on every M4 period, holding the forecast basis
  complete and pinned, so all variation is on the backcast path. Pairs each
  complete arm against the repo default (basis_dim = forecast_length) at
  matched seeds.

dataset: m4
periods:
  - Yearly
  - Quarterly
  - Monthly
  - Weekly
  - Daily
  - Hourly

protocol:
  sampling_style: nbeats_paper
  steps_per_epoch: 1000
  sampling_weights: uniform
  lh_multiplier:
    Yearly: 1.5
    Quarterly: 1.5
    Monthly: 10
    Weekly: 10
    Daily: 10
    Hourly: 10

training:
  active_g: false
  sum_losses: false
  activation: ReLU
  max_steps: 100000
  max_epochs: 150
  patience: 15
  val_check_interval: 100
  min_delta: 0.001
  n_blocks_per_stack: 1
  share_weights: true
  loss: SMAPELoss
  optimizer: Adam
  learning_rate: 0.001
  forecast_multiplier: 5       # L = 5H in every period
  batch_size: 1024

lr_scheduler:
  type: multistep
  n_milestones: 10
  gamma: 0.5

block_params:
  trend_thetas_dim: 3
  wavelet_type: db3
  basis_dim: eq_fcast          # default; the complete arm overrides per period

runs:
  n_runs: 10
  seed_mode: sequential
  base_seed: 42

extra_csv_columns:
  - basis_regime
  - backcast_coverage_pct
  - n_stacks

# ── REFERENCE ARMS ARE NOT RE-RUN ───────────────────────────────────────────
# The `basis_dim = eq_fcast` reference arms already exist at n=10 on all six
# periods, produced under a byte-identical protocol block, training block,
# lr_scheduler block and seed schedule (sequential from 42). Re-running them
# would burn 120 GPU-runs to reproduce numbers already banked:
#
#   this study's reference arm      existing rows (n=60 each, 6 periods x 10)
#   -----------------------------   ------------------------------------------
#   TW_10s_bd_eqfcast            =  TW_10s_td3_bdeq_db3   in
#                                   m4/m4_basis_identity_control_results.csv
#   TWAE_10s_ld32_bd_eqfcast     =  TWAE_10s_ld32_db3     in the same CSV
#
# Equivalence holds because TrendWavelet with basis_dim=eq_fcast and no
# forecast_basis_dim builds exactly the basis this config's reference arm asks
# for, and the E1 config fixes trend_thetas_dim=3 and wavelet_type=db3 too.
# Pair complete-vs-reference on (period, seed) across the two CSVs.
#
# Likewise the Hourly complete arm is independently reproduced by
# TW_10s_bd240 in m4/m4_hourly_basis_width_results.csv (basis_dim=240,
# forecast_basis_dim=48, same seeds); it is kept here as a cross-check because
# ten Hourly runs cost only a few minutes of wall clock.
configs:
  # ── Complete arm: backcast at 100%, forecast still complete and pinned ────
  # basis_dim = eq_bcast resolves to backcast_length per period (5H).
  - name: TW_10s_bd_eqbcast
    stacks: {type: homogeneous, block: TrendWavelet, n: 10}
    block_params: {basis_dim: eq_bcast, forecast_basis_dim: eq_fcast}
    extra_fields: {basis_regime: both_complete, backcast_coverage_pct: 100, n_stacks: 10}

  # ── Same contrast on the AE trunk, the sub 1M headline family ─────────────
  - name: TWAE_10s_ld32_bd_eqbcast
    stacks: {type: homogeneous, block: TrendWaveletAE, n: 10}
    block_params: {basis_dim: eq_bcast, forecast_basis_dim: eq_fcast, latent_dim: 32}
    extra_fields: {basis_regime: both_complete, backcast_coverage_pct: 100, n_stacks: 10}

output:
  results_dir: experiments/results
  csv_filename: m4_complete_basis_results.csv
  save_predictions: false

logging:
  wandb:
    enabled: false
    project: nbeats-lightning
  tensorboard: false

hardware:
  accelerator: auto
  num_workers: 0

analysis:
  enabled: true
  ranking: true
