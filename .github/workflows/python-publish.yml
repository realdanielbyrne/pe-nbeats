# Test, build and publish pe-nbeats to PyPI when a GitHub release is published.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored.
# One-time setup on PyPI: add a (pending) trusted publisher for project
# "pe-nbeats" with owner "realdanielbyrne", repository "N-BEATS-Lightning",
# workflow "python-publish.yml" and environment "pypi".

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install package (CPU torch)
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev]"
    - name: Run tests
      run: pytest tests/test_blocks.py tests/test_models.py tests/test_loaders.py tests/test_preflight.py -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build and check distributions
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check dist/*
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  deploy:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
